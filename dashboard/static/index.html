<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M5 16s4-7 11-7 11 7 11 7-4 7-11 7S5 16 5 16z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--bg2:#fafafa;--bg3:#f2f2f2;--fg:#0a0a0a;--fg2:#45454a;--fg3:#7a7a80;--line:#ebebeb;--line2:#d9d9d9;
--green:#0f9d58;--green-bg:#e6f6ec;--red:#e5484d;--red-bg:#fdecec;--amber:#d98a00;--amber-bg:#fff4dc;--blue:#0070f3;--blue-bg:#e8f1fe;
--sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--shadow:0 8px 24px rgba(0,0,0,.07);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--bg2:#0a0a0a;--bg3:#1a1a1a;--fg:#ededed;--fg2:#b0b0b0;--fg3:#8a8a8a;--line:#242424;--line2:#333;
--green:#3ecf8e;--green-bg:#0d2a1c;--red:#ff6369;--red-bg:#3a1214;--amber:#f5b041;--amber-bg:#33240a;--blue:#3291ff;--blue-bg:#0b2340;--shadow:0 8px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme=dark]{--bg:#000;--bg2:#0a0a0a;--bg3:#1a1a1a;--fg:#ededed;--fg2:#b0b0b0;--fg3:#8a8a8a;--line:#242424;--line2:#333;
--green:#3ecf8e;--green-bg:#0d2a1c;--red:#ff6369;--red-bg:#3a1214;--amber:#f5b041;--amber-bg:#33240a;--blue:#3291ff;--blue-bg:#0b2340;--shadow:0 8px 24px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}.mono{font-family:var(--mono);font-size:13px}
header{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.bar{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:12px;height:56px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600}.slash{color:var(--line2);font-size:22px;font-weight:300}
.tabs{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 10px 12px;color:var(--fg2);position:relative;white-space:nowrap}.tabs a:hover{color:var(--fg)}
.tabs a.on{color:var(--fg)}.tabs a.on:after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--fg);border-radius:2px}
.tabs .sep{width:1px;background:var(--line);margin:10px 8px}.tabs a.more{color:var(--fg3)}.tabs a.more.on,.tabs a.more:hover{color:var(--fg)}
.tabs .n{font-size:11px;background:var(--bg3);border-radius:10px;padding:0 6px;margin-left:5px;color:var(--fg2)}
main{max-width:1080px;margin:0 auto;padding:32px 24px 80px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.2}h2{font-size:14px;font-weight:600;margin:0 0 12px;color:var(--fg)}h3{font-size:15px;font-weight:600;margin:0}
.muted{color:var(--fg2)}.faint{color:var(--fg3)}.small{font-size:14px}.xs{font-size:12.5px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--bg)}.pad{padding:20px}.sec{margin-top:36px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}.nowrap{flex-wrap:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);font:500 13px var(--sans);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg3)}.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}.btn.primary:hover{opacity:.88}.btn.sm{height:28px;padding:0 10px;font-size:12.5px}.btn.ghost{border-color:transparent}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line2);border-radius:6px;height:32px;padding:0 10px;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--fg3)}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}.dot.bad{background:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 22%,transparent)}
.dot.warn{background:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 22%,transparent)}.dot.off{background:var(--line2)}
.dot.run{background:var(--amber);position:relative}.dot.run:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--amber);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--fg2);white-space:nowrap}
.pill.ok{color:var(--green);border-color:transparent;background:var(--green-bg)}.pill.bad{color:var(--red);border-color:transparent;background:var(--red-bg)}.pill.warn{color:var(--amber);border-color:transparent;background:var(--amber-bg)}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line);background:var(--bg);min-width:0}.li:first-child{border-top:none}
a.li:hover,.li.click:hover{background:var(--bg2);cursor:pointer}
.chev{color:var(--fg3);flex:none;transition:transform .15s}a.li:hover .chev,a.card:hover .chev{transform:translateX(2px);color:var(--fg)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:84px;aspect-ratio:16/10;border-radius:6px;border:1px solid var(--line);object-fit:cover;background:var(--bg3);flex:none}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg2);margin-bottom:14px;flex-wrap:wrap}.crumbs a:hover{color:var(--fg)}.crumbs span{color:var(--fg3)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:28px 0 20px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.subtabs::-webkit-scrollbar{display:none}.subtabs a{padding:8px 12px;color:var(--fg2);position:relative;cursor:pointer;white-space:nowrap}.subtabs a.on{color:var(--fg)}
.subtabs a.on:after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:var(--fg)}
pre{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--fg2)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{padding:48px 20px;text-align:center;color:var(--fg2)}.err{color:var(--red);font-size:13px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;font-size:13px}.kv>div:nth-child(odd){color:var(--fg2)}.kv>div{min-width:0;overflow-wrap:anywhere}
dialog{border:none;padding:0;background:transparent;max-width:96vw}dialog::backdrop{background:rgba(0,0,0,.78)}dialog img{max-width:94vw;max-height:86vh;border-radius:8px;display:block}dialog .cap{color:#fff;margin-top:8px;font-size:13px}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
.big{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1}

/* one hue per test type */
.t-Platform{--tc:#6e7781}.t-Comfort{--tc:#e5a000}.t-Locomotion{--tc:#0ea5e9}.t-Body{--tc:#8b5cf6}.t-Interaction{--tc:#ec4899}.t-Building{--tc:#f97316}.t-Vehicles{--tc:#3b82f6}.t-UI{--tc:#14b8a6}.t-Diagnostics{--tc:#a3a3a3}.t-Other{--tc:#a3a3a3}
.tdot{width:9px;height:9px;border-radius:3px;background:var(--tc,#999);display:inline-block;flex:none}
.typepill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:1px 9px 1px 7px;border-radius:999px;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc);font-weight:500;white-space:nowrap}
.li.typed{box-shadow:inset 3px 0 0 var(--tc)}

/* overview: setup */
.machines{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mcard{display:block;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--bg);position:relative;overflow:hidden}
.mcard:hover{border-color:var(--line2);box-shadow:var(--shadow);transform:translateY(-2px)}
.mcard .ico{width:38px;height:38px;border-radius:9px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--fg)}
.mcard .ico svg{width:20px;height:20px}
.mcard .name{font-size:16px;font-weight:600;margin-top:14px;letter-spacing:-.01em}
.mcard .role{color:var(--fg2);font-size:13px}
.mcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg2)}
.mcard.down{background:linear-gradient(180deg,color-mix(in srgb,var(--red) 5%,var(--bg)),var(--bg) 60%)}
.mcard .state{position:absolute;top:18px;right:18px;font-size:12.5px}

/* overview: right now */
.now{display:grid;grid-template-columns:260px minmax(0,1fr);overflow:hidden;position:relative}
.now:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--sc,var(--line2))}.now.s-ok{--sc:var(--green)}.now.s-bad{--sc:var(--red)}.now.s-run{--sc:var(--amber)}
.now .pic{padding:16px;background:radial-gradient(120% 90% at 30% 0%,color-mix(in srgb,var(--sc,var(--line2)) 16%,transparent),transparent 70%),var(--bg2);border-right:1px solid var(--line)}
.now .pic img,.now .pic .ph{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--bg3);color:var(--fg3);font-size:12px;cursor:zoom-in}
.now .info{padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.bar3{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--bg3)}.bar3 i{display:block}
.indet{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;position:relative}.indet i{position:absolute;inset:0 auto 0 0;background:var(--amber);border-radius:3px;transition:width .6s}
.next{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg2);grid-column:1/-1}
.next .txt{flex:1;min-width:0;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* workflow mini */
.wf{display:inline-flex;align-items:center;gap:10px;padding:6px 12px 6px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--fg2)}.wf:hover{border-color:var(--line2);color:var(--fg)}
.wf .segs{display:flex;gap:3px}.wf .segs i{width:14px;height:5px;border-radius:3px;background:var(--line2)}.wf .segs i.ok{background:var(--green)}.wf .segs i.cur{background:var(--amber)}

/* history bars */
.hist{display:flex;gap:3px;align-items:center;flex:none}.hist a,.hist span{width:6px;height:18px;border-radius:2px;background:var(--line2);display:block}
.hist .ok{background:var(--green)}.hist .bad{background:var(--red)}.hist .sel{outline:2px solid var(--fg);outline-offset:1px}

/* screenshots */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.shotcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}.shotcard:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.shotcard img,.shotcard .ph{width:100%;aspect-ratio:16/10;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--bg3);color:var(--fg3);cursor:zoom-in;border-bottom:1px solid var(--line);font-size:12px}
.shotcard .body{padding:12px 14px}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stats>div{padding:16px 18px;border-left:1px solid var(--line)}.stats>div:first-child{border-left:none}.stats .k{font-size:12.5px;color:var(--fg2);margin-bottom:8px}
.g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}

/* menu */
.menu{position:relative}.menu>summary{display:inline-flex}.menu .pop{position:absolute;right:0;top:38px;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:200px;z-index:9}
.menu .pop a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:6px;color:var(--fg2)}.menu .pop a:hover{background:var(--bg3);color:var(--fg)}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.enter>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(n+5){animation-delay:.2s}
.enter .li,.enter .shotcard,.enter .mcard{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
.enter .bar3{animation:grow .7s cubic-bezier(.2,.7,.2,1) both .15s;transform-origin:left}
.mcard,.shotcard,.li,.card{transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.btn{transition:background .15s,opacity .15s,transform .1s}.btn:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* AI-first: needs you, sessions, features */
:root{--accent:var(--blue);--accent-bg:var(--blue-bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.accent:hover{opacity:.9;background:var(--accent)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600}
.tabs .n.acc{background:var(--accent);color:#fff}
.asks{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.ask{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:12px;padding:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 6%,var(--bg)),var(--bg) 70%);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 10%,transparent)}
.enter .ask{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.kico{width:36px;height:36px;border-radius:9px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}.kico svg{width:19px;height:19px}
.akind{color:var(--accent);font-weight:500;margin-bottom:2px}.akind a:hover{text-decoration:underline}
.atitle{font-size:15.5px;font-weight:600;line-height:1.35;margin-bottom:4px}
.cmd{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px}.cmd .mono{overflow-wrap:anywhere}
.calm{display:flex;gap:14px;align-items:center;padding:18px 20px}
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.scard{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.scard:hover{border-color:var(--line2);box-shadow:var(--shadow);transform:translateY(-2px)}
.scard.s-blocked{border-color:color-mix(in srgb,var(--amber) 40%,var(--line))}
.enter .scard,.enter .fcard{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
.sname{font-size:15px;font-weight:600;margin-top:10px}.sfeat{margin-top:2px}.sdoing{margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard,.fcard{transition:border-color .15s,transform .15s,box-shadow .15s}
.nowsm{display:flex;align-items:center;gap:16px;padding:14px 16px}.nowsm .thumb{width:120px}
.board{display:flex;gap:12px;overflow-x:auto;margin-top:22px;padding-bottom:8px}
.col{flex:1 0 190px;min-width:190px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px}
.col.empty-col{flex:0 0 104px;min-width:104px;opacity:.6}
.chead{display:flex;justify-content:space-between;font-size:13px;font-weight:500;padding:2px 4px}
.fcard{display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.fcard:hover{border-color:var(--line2);box-shadow:var(--shadow);transform:translateY(-2px)}
.ftitle{font-weight:500;line-height:1.35}
.pipe{display:flex;gap:4px;margin-top:22px}.pipe>div{flex:1;min-width:0}.pipe i{display:block;height:5px;border-radius:3px;background:var(--line2)}.pipe .ok i{background:var(--green)}.pipe .cur i{background:var(--accent)}
.pipe span{display:block;font-size:12px;color:var(--fg3);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pipe .cur span{color:var(--fg);font-weight:500}
.trail{position:relative;padding-left:22px}.trail:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tstep{position:relative;padding-bottom:16px}.tdotl{position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line2)}
.tstep.live .tdotl{border-color:var(--amber);background:var(--amber)}.tstep:first-child .tdotl{border-color:var(--fg2)}
.fails{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.fails a{font-family:var(--mono);font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--red-bg);color:var(--red)}.fails a:hover{filter:brightness(.95)}
.expand{padding:4px 16px 14px 54px;background:var(--bg2);border-top:1px solid var(--line)}
@media (max-width:760px){.asks,.sessions{grid-template-columns:1fr}.board{flex-direction:column;overflow:visible}.col{min-width:0;flex:none}.col.empty-col{display:none}
 .pipe span{display:none}.pipe .cur span{display:block;overflow:visible}.nowsm .thumb{display:block;width:72px}.expand{padding-left:16px}}
@media (max-width:760px){
 main,.bar{padding-left:16px;padding-right:16px}main{padding-top:24px}h1{font-size:24px}
 .now{grid-template-columns:1fr}.now .pic{border-right:none;border-bottom:1px solid var(--line)}.now .info{padding:18px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats>div:nth-child(3){border-left:none}.stats>div:nth-child(n+3){border-top:1px solid var(--line)}
 .thumb,.hide-sm{display:none}.kv{grid-template-columns:1fr;gap:2px}.kv>div:nth-child(even){margin-bottom:10px}
 .li{padding:12px 14px}.filters{flex-direction:column;align-items:stretch}.filters .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.filters .chip{flex:none}.filters input{width:100%!important;order:-1}.machines{grid-template-columns:1fr 1fr}.mcard{padding:14px}.mcard .state{top:14px;right:14px}.mcard .foot{flex-direction:column;align-items:flex-start;gap:2px}
}
@media (max-width:520px){.machines{grid-template-columns:1fr;gap:10px}
 .mcard{display:grid;grid-template-columns:38px minmax(0,1fr) auto;column-gap:12px;align-items:center}
 .mcard .ico{grid-column:1;grid-row:1/3}.mcard .name{grid-column:2;grid-row:1;margin-top:0;line-height:1.3}.mcard .role{grid-column:2;grid-row:2}
 .mcard .state{position:static;grid-column:3;grid-row:1/3}.mcard .foot{grid-column:1/-1;grid-row:3;flex-direction:row;margin-top:12px;padding-top:10px}}
</style>
</head>
<body>
<header>
 <div class="bar">
  <a class="logo" href="#/"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--fg)"/><path d="M5 16s4-7 11-7 11 7 11 7-4 7-11 7S5 16 5 16z" fill="none" stroke="var(--bg)" stroke-width="2"/><circle cx="16" cy="16" r="3.5" fill="var(--bg)"/></svg>Irisify</a>
  <span class="slash">/</span><b id="crumb" class="ell" style="font-weight:500"></b>
  <span class="grow"></span>
  <button class="btn sm ghost" onclick="toggleTheme()" aria-label="Switch theme">◐</button>
 </div>
 <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<dialog id="zoom" onclick="this.close()"><img id="zoomimg" alt=""><div class="cap" id="zoomcap"></div></dialog>
<script>
const TABS=[["","Overview"],["features","Features"],["builds","Builds"],["tests","Tests"],["machines","Machines"]];
const MORE=[["shots","Screenshots"],["issues","Issues"],["checklist","Headset checklist"],["intake","Intake"],["workflow","Workflow"]];
const ALIAS={build:"builds",test:"tests",machine:"machines",feature:"features",session:""};
let D=null,R={},err="",sub={},filt={type:"All",q:""},open={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc=encodeURIComponent;
function route(){const h=location.hash.replace(/^#\/?/,"");const [path,q]=h.split("?");return {parts:path.split("/").filter(Boolean).map(decodeURIComponent),params:Object.fromEntries(new URLSearchParams(q||""))}}
async function post(path,body){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Irisify":"1"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
async function load(){try{D=await (await fetch("/api/overview")).json();err=""}catch(e){err="Can't reach the Irisify server. Is `irisify dashboard` running?"}render()}
function toggleTheme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.irisTheme=r.dataset.theme}catch(e){}}
try{if(localStorage.irisTheme)document.documentElement.dataset.theme=localStorage.irisTheme}catch(e){}
let animate=true;window.onhashchange=()=>{window.scrollTo(0,0);animate=true;render()};
const ago=t=>{if(!t)return"";const s=(Date.now()-Date.parse(t))/1000;if(s<60)return"just now";if(s<3600)return Math.round(s/60)+"m ago";if(s<86400)return Math.round(s/3600)+"h ago";return Math.round(s/86400)+"d ago"};
const failN=c=>(c.FAIL||0)+(c.CRASH||0);
const total=r=>r.scenarios.length;
const rstate=r=>failN(r.counts)?"bad":"ok";
const rlabel=r=>r.counts.CRASH?"Crashed":r.counts.FAIL?"Failed":"Passed";
const resDot=x=>x=="PASS"?"ok":x=="SKIP"?"off":"bad";
const resCls=x=>x=="PASS"?"ok":x=="SKIP"?"skip":"bad";
const shotURL=(run,f)=>`/shots/${enc(run)}/${enc(f)}`;
const base=n=>n.replace(/#\d+$/,"");
function zoom(src,cap){$("zoomimg").src=src;$("zoomcap").textContent=cap||"";$("zoom").showModal()}
function failChips(r,max){const f=r.scenarios.filter(x=>x.result=="FAIL"||x.result=="CRASH");if(!f.length)return"";return `<div class="fails">${f.slice(0,max).map(x=>`<a href="#/test/${enc(base(x.name))}?run=${enc(r.id)}" onclick="event.stopPropagation()" title="open this test case">${esc(x.name)}</a>`).join("")}${f.length>max?`<a href="#/build/${enc(r.id)}" style="background:var(--bg3);color:var(--fg2)">+${f.length-max}</a>`:""}</div>`}
const CHEV=`<svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function bar3(c,w){const t=(c.PASS||0)+failN(c)+(c.SKIP||0)||1;return `<div class="bar3" style="${w?`width:${w}px`:""}" title="${c.PASS} passed, ${failN(c)} failed, ${c.SKIP||0} skipped"><i style="width:${c.PASS/t*100}%;background:var(--green)"></i><i style="width:${failN(c)/t*100}%;background:var(--red)"></i><i style="width:${(c.SKIP||0)/t*100}%;background:var(--line2)"></i></div>`}
const tcls=t=>"t-"+String(t||"Other").split(" ")[0];
const typePill=t=>`<span class="typepill ${tcls(t)}"><span class="tdot"></span>${esc(t)}</span>`;
const typeOf=n=>(D.catalog.find(c=>c.name==base(n))||{}).type||"Other";
const runById=id=>D.runs.find(r=>r.id==id);
const lastRun=()=>D.runs[D.runs.length-1];
function thumb(r){return r.preview?`<img class="thumb" loading="lazy" src="${shotURL(r.id,r.preview.file)}" alt="">`:`<div class="thumb"></div>`}
function copy(b){navigator.clipboard?.writeText(b.dataset.t);b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200)}
function crumbs(items){return `<div class="crumbs">${items.map(([t,h],i)=>(i?`<span>/</span>`:"")+(h?`<a href="${h}">${esc(t)}</a>`:`<b style="font-weight:500;color:var(--fg)" class="${i>1?"mono":""}">${esc(t)}</b>`)).join("")}</div>`}

/* ---------- machines helpers ---------- */
const ICON={
 dev:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>`,
 pc:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>`,
 headset:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5A2.5 2.5 0 0 1 5.5 7h13A2.5 2.5 0 0 1 21 9.5v5a2.5 2.5 0 0 1-2.5 2.5h-3l-2-2.5h-3L8.5 17h-3A2.5 2.5 0 0 1 3 14.5z"/></svg>`};
const ROLE={dev:"Builds the mod","game-host":"Runs the game",rig:"Runs tests",headset:"Headset"};
function mInfo(n){const m=D.machines[n]||{},s=D.machines_status[n]||{},roles=m.roles||[];
 const kind=roles.includes("headset")?"headset":roles.includes("dev")&&roles.length==1?"dev":"pc";
 const state=D.jobs?.["check:"+n]?.state=="running"?"run":!s.at?"off":s.reachable?"ok":"bad";
 const stateText={run:"Checking",off:"Not checked",ok:"Online",bad:"Offline"}[state];
 const runs=D.runs.filter(r=>r.machine==n);const lr=runs[runs.length-1];
 const build=D.deploys[n]?.build?.id||s.facts?.build?.id||(lr&&lr.build.id!="unknown"?lr.build.id:null);
 const link=m.link=="local"?"This machine":m.link=="adb"?"adb":"SSH";
 const prof=D.profiles.find(p=>p.type==m.headset);
 const todo=(s.steps||[]).filter(x=>x.done===false).length+((D.preflight[n]?.checks||[]).filter(c=>c.ok===false).length);
 return {n,m,s,roles,kind,state,stateText,build,link,prof,todo,dev:roles.length==1&&roles[0]=="dev"}}
function machineCard(n){const i=mInfo(n);
 const role=i.roles.map(r=>ROLE[r]||r).join(" · ");
 return `<a class="mcard ${i.state=="bad"?"down":""}" href="#/machine/${enc(n)}">
  <span class="state status"><span class="dot ${i.state}"></span>${i.stateText}</span>
  <div class="ico">${ICON[i.kind]}</div>
  <div class="name">${esc(n)}</div><div class="role">${esc(role)}</div>
  <div class="foot"><span>${esc(i.link)}${i.kind=="headset"&&i.prof?` · ${esc(i.prof.name.replace(/ controllers$/,""))}`:""}</span>
  <span class="${i.todo?"a":""}">${i.todo?`${i.todo} to fix`:i.dev?"":i.build?`<span class="mono xs">${esc(i.build)}</span>`:"no build yet"}</span></div></a>`}

/* ---------- shell ---------- */
function render(){
 const {parts,params}=route();const top=parts[0]||"";const tab=ALIAS[top]||top;
 const cnt=k=>!D?0:k=="issues"?D.issues.filter(i=>i.state!="closed").length:k=="shots"?D.shots.filter(s=>!s.review).length:0;
 const na=D&&!err?asksAll().length:0;$("tabs").innerHTML=TABS.map(([k,t])=>`<a href="#/${k}" class="${k==tab?"on":""}">${t}${k==""&&na?`<span class="n acc">${na}</span>`:""}</a>`).join("")+`<span class="sep"></span>`+
  MORE.map(([k,t])=>`<a href="#/${k}" class="more ${k==tab?"on":""}">${t}${cnt(k)?`<span class="n">${cnt(k)}</span>`:""}</a>`).join("");
 if(err){$("main").innerHTML=`<div class="card pad err">${esc(err)}</div>`;return}if(!D)return;
 $("crumb").textContent=D.project.game||"project";
 const f={"":pOverview,features:pFeatures,feature:pFeature,session:pSession,builds:pBuilds,build:pBuild,tests:pTests,test:pTest,machines:pMachines,machine:pMachine,shots:pShots,issues:pIssues,checklist:pChecklist,intake:pIntake,workflow:pWorkflow}[top]||pOverview;
 const m=$("main");const keep=document.activeElement?.id;m.classList.toggle("enter",animate);m.innerHTML=f(parts,params);
 if(animate){m.querySelectorAll(".li,.shotcard,.mcard").forEach((el,i)=>el.style.animationDelay=(60+Math.min(i,20)*25)+"ms");animate=false}
 if(keep&&$(keep)&&keep=="q"){const i=$(keep);i.focus();i.setSelectionRange(i.value.length,i.value.length)}}

/* ---------- overview: setup · right now · progress ---------- */
function runningSuite(){const j=Object.entries(D.jobs||{}).find(([k,j])=>k.startsWith("suite:")&&j.state=="running");if(!j)return null;
 const name=j[0].slice(6);const act=(D.activity||[]).filter(a=>a.what=="suite started"&&a.suite==name).pop()||{};
 const s=D.suites.find(x=>x.name==name)||{};const mins=act.minutes||s.minutes||10;const el=(Date.now()-Date.parse(j[1].at))/60000;
 return {name,machine:act.machine,count:s.count,mins,el,pct:Math.min(95,el/mins*100)}}
/* asks: what the AI needs from the human; sign-offs show up here too */
const KIND={do:["Do this",`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>`],
 decide:["Decide",`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a4 4 0 0 0 4 4h4a4 4 0 0 1 4 4v4M18 3v6a4 4 0 0 1-4 4"/><path d="M3 6l3-3 3 3M15 6l3-3 3 3"/></svg>`],
 check:["Check in the headset",ICON.headset]};
function asksAll(){const wf=D.workflow;const cur=wf.phases.find(p=>p.id==wf.current);const out=(D.asks||[]).filter(a=>a.state!="done"&&a.state!="dismissed");
 const so=cur&&cur.id=="design"&&!D.signoffs.design?"design":cur&&cur.id=="slice"&&!D.signoffs.slice?"slice":null;
 if(so)out.unshift({id:"signoff:"+so,signoff:so,kind:so=="slice"?"check":"decide",title:so=="design"?"Sign off the design decisions":"Do the feel check in the headset, then sign off the slice",why:cur.next||"",from:"workflow"});
 return out}
function askCard(a,i){const k=KIND[a.kind]||KIND.do;const o=open["ask"+a.id];
 const acts=a.signoff?`<button class="btn sm accent" onclick="signoff('${a.signoff}')">Sign off</button>`
  :a.kind=="check"?(o?`<input id="askin${i}" placeholder="What did you see?" class="grow"><button class="btn sm accent" onclick="askDone('${esc(a.id)}','done',$('askin${i}').value||'problem')">Send</button>`
    :`<button class="btn sm accent" onclick="askDone('${esc(a.id)}','done','looks fine')">Looks fine</button><button class="btn sm" onclick="open['ask${esc(a.id)}']=1;render()">Found a problem</button>`)
  :a.kind=="decide"?`<input id="askin${i}" placeholder="Your answer" class="grow"><button class="btn sm accent" onclick="askDone('${esc(a.id)}','done',$('askin${i}').value)">Answer</button>`
  :`<button class="btn sm accent" onclick="askDone('${esc(a.id)}','done')">Done</button>`;
 return `<div class="ask"><div class="row nowrap" style="align-items:flex-start;gap:14px"><span class="kico" title="${k[0]}">${k[1]}</span><div class="grow">
  <div class="xs akind">${k[0]}${a.from?` · <span class="faint">${a.from.startsWith("vr-")||(D.agents||[]).some(g=>g.agent==a.from)?`<a href="#/session/${enc(a.from)}">${esc(a.from)}</a>`:esc(a.from)}</span>`:""}</div>
  <div class="atitle">${esc(a.title)}</div>${a.why?`<div class="small muted">${esc(a.why)}</div>`:""}
  ${a.command?`<div class="cmd"><span class="mono xs grow">${esc(a.command)}</span><button class="btn sm ghost" onclick="copy(this)" data-t="${esc(a.command)}">Copy</button></div>`:""}
  <div class="row" style="margin-top:12px">${acts}${a.signoff?"":`<button class="btn sm ghost faint" onclick="askDone('${esc(a.id)}','dismissed')">Dismiss</button>`}</div></div></div></div>`}
async function askDone(id,state,answer){try{await post("/api/ask",{id,state,answer:answer||null});load()}catch(e){alert(e.message)}}
/* sessions */
const AST={working:["run","Working"],blocked:["warn","Waiting on you"],idle:["off","Idle"]};
const featTitle=id=>(D.features||{})[id]?.title||id;
function sessionCard(g){const st=AST[g.state]||AST.idle;
 return `<a class="scard s-${g.state}" href="#/session/${enc(g.agent)}"><div class="row between nowrap"><span class="status small"><span class="dot ${st[0]}"></span>${st[1]}</span><span class="xs faint">${esc(ago(g.at))}</span></div>
  <div class="sname mono">${esc(g.agent)}</div>${g.feature?`<div class="small sfeat ell">${esc(featTitle(g.feature))}</div>`:""}
  <div class="small muted sdoing">${esc(g.doing||"")}</div></a>`}
function pOverview(){const wf=D.workflow;const ph=wf.phases;const ci=ph.findIndex(p=>p.id==wf.current);const cur=ph[ci];
 const r=lastRun();const live=runningSuite();const asks=asksAll();const ag=(D.agents||[]).slice().sort((a,b)=>({blocked:0,working:1,idle:2}[a.state]??3)-({blocked:0,working:1,idle:2}[b.state]??3));
 const mini=`<a class="wf" href="#/workflow" title="Workflow"><span class="segs">${ph.map((p,i)=>`<i class="${p.ok?"ok":i==ci?"cur":""}"></i>`).join("")}</span><span>${cur?`Step ${ci+1} of ${ph.length} · <b style="color:var(--fg);font-weight:500">${esc(cur.title)}</b>`:"All steps done"}</span></a>`;
 let nowCard;
 if(live)nowCard=`<div class="card nowsm s-run">${r?.preview?`<img class="thumb" src="${shotURL(r.id,r.preview.file)}" alt="" style="opacity:.55">`:`<div class="thumb"></div>`}<div class="grow"><span class="status small"><span class="dot run"></span>Running <b>${esc(live.name)}</b>${live.machine?` <span class="muted" style="font-weight:400">on ${esc(live.machine)}</span>`:""}</span>
  <div class="indet" style="margin:10px 0 6px"><i style="width:${live.pct}%"></i></div><div class="xs muted">${live.count?`${live.count} tests · `:""}${Math.round(live.el)} of ~${Math.round(live.mins)} min</div></div></div>`;
 else if(r){const st=rstate(r);nowCard=`<div class="card nowsm s-${st} click" onclick="location.hash='#/build/${enc(r.id)}'" style="cursor:pointer">${r.preview?`<img class="thumb" src="${shotURL(r.id,r.preview.file)}" alt="">`:`<div class="thumb"></div>`}
  <div class="grow"><div class="row between nowrap"><span class="status small"><span class="dot ${st}"></span>${rlabel(r)} · ${r.counts.PASS}/${total(r)} passed</span><span class="xs faint">${esc(ago(r.imported))}</span></div>
  <div style="margin:10px 0 6px">${bar3(r.counts)}</div><div class="xs muted ell">Build <span class="mono" style="color:var(--fg)">${esc(r.build.id)}</span> · ${esc(r.suite||"")} · ${esc(r.machine)}</div>${failChips(r,4)}</div>${CHEV}</div>`}
 else nowCard=`<div class="card pad small muted">Nothing has run yet. Your agent runs the smoke suite once a rig machine is set up.</div>`;
 return `<div class="row between" style="margin-bottom:28px"><h1>${esc(D.project.game||"Project")}</h1>${mini}</div>
 <div class="row" style="margin-bottom:12px;gap:8px"><h2 style="margin:0;color:var(--fg)">Needs you</h2>${asks.length?`<span class="badge">${asks.length}</span>`:""}</div>
 ${asks.length?`<div class="asks">${asks.map(askCard).join("")}</div>`:`<div class="card calm"><span class="dot ok"></span><div><b>Nothing needs you right now.</b><div class="small muted">Your agents will ask here when they need your hands, a decision or a look in the headset.</div></div></div>`}
 <div class="sec"><div class="row between"><h2>Sessions</h2><span class="xs faint" style="margin-bottom:12px">${ag.filter(g=>g.state=="working").length} working</span></div>
 ${ag.length?`<div class="sessions">${ag.map(sessionCard).join("")}</div>`:`<div class="card pad small muted">No agent sessions yet. Each agent reports here with <span class="mono">irisify agent</span>.</div>`}</div>
 <div class="sec"><div class="row between"><h2>Your setup</h2><a class="xs muted" href="#/machines" style="margin-bottom:12px">Details</a></div>
 <div class="machines">${Object.keys(D.machines).map(machineCard).join("")||`<div class="card pad small muted">No machines yet. Your agent adds them.</div>`}</div></div>
 <div class="sec"><div class="row between"><h2>Latest build</h2><a class="xs muted" href="#/builds" style="margin-bottom:12px">All builds</a></div>${nowCard}</div>`}
async function signoff(w){await post("/api/signoff",{what:w});load()}

/* ---------- features ---------- */
const FSTATES=[["idea","Idea"],["design","Design"],["building","Building"],["testing","Testing"],["merged","Merged"],["in-headset","In headset"],["done","Done"]];
function scen(n){const c=D.catalog.find(x=>x.name==n);const l=c?.history?.[c.history.length-1];return {n,c,l,cls:l?resDot(l.result):"off"}}
function featCard(id,f){const sc=(f.scenarios||[]).map(scen);const pass=sc.filter(s=>s.cls=="ok").length,ran=sc.filter(s=>s.l).length;const ag=(D.agents||[]).find(g=>g.agent==f.owner);
 return `<a class="fcard" href="#/feature/${enc(id)}"><div class="ftitle">${esc(f.title||id)}</div>
  ${f.owner?`<div class="xs muted row nowrap" style="gap:6px;margin-top:6px"><span class="dot ${ag?(AST[ag.state]||AST.idle)[0]:"off"}" style="width:7px;height:7px"></span><span class="mono ell">${esc(f.owner)}</span></div>`:`<div class="xs faint" style="margin-top:6px">no session</div>`}
  ${sc.length?`<div class="row nowrap" style="gap:4px;margin-top:12px">${sc.map(s=>`<span class="dot ${s.cls}" style="width:7px;height:7px;box-shadow:none" title="${esc(s.n)}"></span>`).join("")}<span class="xs faint" style="margin-left:4px">${ran?`${pass}/${sc.length} passing`:"not run yet"}</span></div>`:""}</a>`}
function pFeatures(){const F=Object.entries(D.features||{});const cols=FSTATES.concat(F.some(([i,f])=>f.state=="parked")?[["parked","Parked"]]:[]);
 return `<div class="row between"><h1>Features</h1><span class="muted small">${F.length} features · ${F.filter(([i,f])=>f.state!="done"&&f.state!="parked").length} in flight</span></div>
 <p class="muted small" style="margin:6px 0 0">Your agents move features along as they work.</p>
 ${F.length?`<div class="board">${cols.map(([k,t])=>{const fs=F.filter(([i,f])=>(f.state||"idea")==k);
  return `<div class="col ${fs.length?"":"empty-col"}"><div class="chead"><span>${t}</span><span class="faint">${fs.length}</span></div>${fs.map(([i,f])=>featCard(i,f)).join("")}</div>`}).join("")}</div>`:`<div class="card pad muted small sec">No features yet. Agents add them as they start work.</div>`}`}
function trail(g){const t=(g?.trail||[]).slice().reverse();if(!t.length)return `<div class="small muted">No steps reported yet</div>`;
 return `<div class="trail">${t.map((x,i)=>`<div class="tstep ${i==0&&g.state=="working"?"live":""}"><span class="tdotl"></span><div class="small">${esc(x.doing)}</div><div class="xs faint">${esc(ago(x.at))}</div></div>`).join("")}</div>`}
function pFeature(parts){const id=parts[1];const f=(D.features||{})[id];if(!f)return `${crumbs([["Features","#/features"],[id]])}<div class="empty">No such feature</div>`;
 const si=FSTATES.findIndex(s=>s[0]==f.state);const g=(D.agents||[]).find(x=>x.agent==f.owner);const sc=(f.scenarios||[]).map(scen);
 return `${crumbs([["Features","#/features"],[f.title||id]])}<h1>${esc(f.title||id)}</h1>
 <div class="row small muted" style="margin-top:8px"><span class="pill">${esc((FSTATES[si]||[0,f.state])[1])}</span>${f.branch?`<span class="mono xs">${esc(f.branch)}</span>`:""}<span>updated ${esc(ago(f.updated))}</span></div>
 <div class="pipe">${FSTATES.map((s,i)=>`<div class="${i<si?"ok":i==si?"cur":""}"><i></i><span>${s[1]}</span></div>`).join("")}</div>
 <div class="sec"><h2>Scenarios</h2>${sc.length?`<div class="list">${sc.map(s=>`<a class="li ${s.c?"typed "+tcls(s.c.type):""}" href="#/test/${enc(s.n)}"><span class="dot ${s.cls}"></span><span class="mono grow ell">${esc(s.n)}</span>${s.c?`<span class="hist hide-sm">${s.c.history.slice(-16).map(h=>`<span class="${resCls(h.result)}"></span>`).join("")}</span>`:`<span class="xs faint">not run yet</span>`}${CHEV}</a>`).join("")}</div>`:`<div class="small muted">No scenarios linked yet</div>`}</div>
 <div class="sec"><h2>Session</h2>${g?`<div style="max-width:420px">${sessionCard(g)}</div><div style="margin-top:20px">${trail(g)}</div>`:`<div class="small muted">${f.owner?esc(f.owner)+" hasn't reported yet":"No session owns this yet"}</div>`}</div>`}
function pSession(parts){const n=parts[1];const g=(D.agents||[]).find(x=>x.agent==n);if(!g)return `${crumbs([["Overview","#/"],[n]])}<div class="empty">No such session</div>`;
 const st=AST[g.state]||AST.idle;const f=(D.features||{})[g.feature];const asks=asksAll().filter(a=>a.from==n);

 return `${crumbs([["Overview","#/"],["Workflow"]])}<h1>Workflow</h1><p class="muted">${wf.phases.filter(p=>p.ok).length} of ${wf.phases.length} steps done. Each step unlocks the next.</p>

/* ---------- one build ---------- */
function pBuild(parts){const r=runById(parts[1]);if(!r)return `${crumbs([["Builds","#/builds"],["?"]])}<div class="empty">No such build</div>`;const tab=sub.build||"tests";
 const rank=s=>s.result=="PASS"?2:s.result=="SKIP"?3:0;
 const groups={};r.scenarios.forEach(s=>{(groups[typeOf(s.name)]=groups[typeOf(s.name)]||[]).push(s)});
 const gs=Object.entries(groups).map(([t,ss])=>({t,ss:ss.slice().sort((a,b)=>rank(a)-rank(b)),bad:ss.filter(s=>rank(s)==0).length})).sort((a,b)=>b.bad-a.bad);
 const fl=(D.flaky||{})[r.build.id]||{};const shots=r.scenarios.flatMap(s=>s.files.map(f=>({s,f})));const st=rstate(r);
 const body=tab=="tests"?gs.map(g=>`<div style="margin-top:22px"><div class="row" style="margin-bottom:10px">${typePill(g.t)}<span class="small ${g.bad?"r":"faint"}">${g.bad?`${g.bad} failed`:"all passed"}</span></div>
  <div class="list">${g.ss.map(s=>`<a class="li typed ${tcls(g.t)}" href="#/test/${enc(base(s.name))}?run=${enc(r.id)}"><span class="dot ${resDot(s.result)}"></span><span class="mono grow ell">${esc(s.name)}</span>
  ${fl[base(s.name)]?`<span class="pill warn hide-sm">flaky</span>`:""}<span class="small ${s.result=="PASS"?"faint":s.result=="SKIP"?"faint":"r"}">${s.result=="PASS"?"Passed":s.result=="SKIP"?"Skipped":s.result=="CRASH"?"Crashed":"Failed"}</span>${CHEV}</a>`).join("")}</div></div>`).join("")
 :tab=="shots"?(shots.length?`<div class="gallery">${shots.map(({s,f})=>`<div class="shotcard"><img loading="lazy" src="${shotURL(r.id,f)}" alt="" onclick="zoom(this.src,'${esc(s.name)} · ${esc(f)}')"><div class="body"><a class="mono small" href="#/test/${enc(base(s.name))}?run=${enc(r.id)}"><b>${esc(s.name)}</b></a></div></div>`).join("")}</div>`:`<div class="empty">No screenshots in this build</div>`)
 :`<div class="card pad"><div class="kv">${[["Build",r.build.id],["Commit",r.build.commit||"—"],["Branch",r.build.branch||"—"],["Merged",(r.build.merged||[]).join(", ")||"—"],["Suite",r.suite||"—"],["Machine",r.machine],["Ran",r.imported],["Comfort events",r.comfort_events],["Run id",r.id]].map(([k,v])=>`<div>${esc(k)}</div><div class="mono">${esc(v)}</div>`).join("")}</div>${r.build_inferred?`<div class="xs faint" style="margin-top:14px">Build id inferred: the results didn't carry one.</div>`:""}</div>`;
 return `${crumbs([["Builds","#/builds"],[r.build.id]])}
 <div class="row between"><h1 class="mono" style="font-size:26px">${esc(r.build.id)}</h1><span class="status" style="font-size:15px"><span class="dot ${st}"></span>${rlabel(r)}</span></div>
 <div class="muted small" style="margin-top:4px">${esc(r.suite||"")} on ${esc(r.machine)} · ${esc(ago(r.imported))}</div>
 <div class="stats" style="margin-top:22px"><div><div class="k">Passed</div><div class="big g">${r.counts.PASS}</div></div><div><div class="k">Failed</div><div class="big ${failN(r.counts)?"r":"faint"}">${failN(r.counts)}</div></div>
 <div><div class="k">Skipped</div><div class="big faint">${r.counts.SKIP||0}</div></div><div><div class="k">Comfort events</div><div class="big ${r.comfort_events?"a":"faint"}">${r.comfort_events}</div></div></div>
 <div class="subtabs">${[["tests",`Tests ${total(r)}`],["shots",`Screenshots ${shots.length}`],["info","Info"]].map(([k,t])=>`<a class="${tab==k?"on":""}" onclick="sub.build='${k}';render()">${t}</a>`).join("")}</div>${body}`}

/* ---------- tests catalog ---------- */
function pTests(){const cat=D.catalog;const types=["All",...new Set(cat.map(c=>c.type))];const last=c=>c.history[c.history.length-1];
 const shown=cat.filter(c=>(filt.type=="All"||c.type==filt.type)&&(!filt.q||c.name.includes(filt.q))).sort((a,b)=>(resCls(last(b)?.result||"SKIP")=="bad")-(resCls(last(a)?.result||"SKIP")=="bad"));
 const failing=cat.filter(c=>last(c)&&resCls(last(c).result)=="bad").length;
 return `<div class="row between"><h1>Tests</h1><span class="muted small">${cat.length} tests${failing?` · <span class="r">${failing} failing</span>`:""}</span></div>
 <div class="row filters" style="margin:20px 0"><div class="chips grow">${types.map(t=>`<span class="chip ${filt.type==t?"on":""} ${tcls(t)}" onclick="filt.type='${esc(t)}';render()">${t!="All"?`<span class="tdot"></span>`:""}${esc(t.split(" ")[0])}</span>`).join("")}</div>
 <input id="q" placeholder="Search" value="${esc(filt.q)}" oninput="filt.q=this.value;render()" style="width:180px"></div>
 <div class="list">${shown.map(c=>{const l=last(c);return `<a class="li typed ${tcls(c.type)}" href="#/test/${enc(c.name)}"><span class="dot ${l?resDot(l.result):"off"}"></span><span class="mono grow ell">${esc(c.name)}</span>
  <span class="hist hide-sm">${c.history.slice(-16).map(h=>`<span class="${resCls(h.result)}"></span>`).join("")}</span>${CHEV}</a>`}).join("")||`<div class="empty">No tests match</div>`}</div>`}

/* ---------- one test case ---------- */
function pTest(parts,params){const name=parts[1]||"";const key=name;
 if(R.key!==key){R={key,loading:true};fetch("/api/test/"+enc(name)).then(r=>r.json()).then(j=>{R={key,...j};render()}).catch(()=>{R={key,entries:[]};render()});return `<div class="empty">Loading…</div>`}
 if(R.loading)return `<div class="empty">Loading…</div>`;
 const t=R.test||{name,history:[]};const es=R.entries||[];
 if(!es.length)return `${crumbs([["Tests","#/tests"],[name]])}<h1 class="mono">${esc(name)}</h1><div class="empty">This test hasn't run yet.</div>`;
 const e=es.find(x=>x.run==params.run)||es[es.length-1];const failing=e.checks.filter(c=>!c.ok);const shots=e.shots.filter(s=>s.present);
 const tab=sub.test||"checks";const fromBuild=params.run&&runById(params.run);
 const checks=e.checks.slice().sort((a,b)=>a.ok-b.ok);
 const body=tab=="checks"?`<div class="list">${checks.map((c,i)=>{const o=open["c"+i];const v=JSON.stringify(c.value);
   return `<div class="li click" style="display:block" onclick="open['c${i}']=!open['c${i}'];render()"><div class="row nowrap"><span class="dot ${c.ok?"ok":"bad"}"></span><span class="grow">${esc(c.check)}</span>${v!==undefined?CHEV.replace('class="chev"',`class="chev" style="transform:rotate(${o?90:0}deg)"`):""}</div>
   ${o&&v!==undefined?`<pre style="margin-top:10px">${esc(JSON.stringify(c.value,null,1))}</pre>`:""}</div>`}).join("")||`<div class="empty">No checks recorded</div>`}</div>`
 :tab=="shots"?(shots.length?`<div class="gallery">${shots.map(s=>`<div class="shotcard"><img src="${shotURL(e.run,s.file)}" alt="" onclick="zoom(this.src,'${esc(s.moment)}')"><div class="body"><b class="small">${esc(s.moment)}</b>${s.question?`<div class="xs muted">${esc(s.question)}</div>`:""}</div></div>`).join("")}</div>`:`<div class="empty">No screenshots in this run</div>`)
 :tab=="log"?`${e.errors?.length?`<h2>Errors</h2><pre style="margin-bottom:18px">${esc(e.errors.join("\n"))}</pre>`:""}${e.log?.length?`<pre>${esc(e.log.join("\n"))}</pre>`:`<div class="empty">No log lines</div>`}${e.startState?`<h2 style="margin-top:18px">Start state</h2><pre>${esc(JSON.stringify(e.startState,null,1))}</pre>`:""}`
 :`<div class="card pad"><h3 style="margin-bottom:8px">What it checks</h3>${(t.covers||[]).map(c=>`<div class="small">✓ ${esc(c)}</div>`).join("")||`<div class="small muted">No description yet</div>`}
   <h3 style="margin:18px 0 8px">Only the headset can tell</h3>${(t.cannot_cover||[]).map(c=>`<div class="small">◌ ${esc(c)}</div>`).join("")||`<div class="small muted">Nothing listed</div>`}
   <div class="kv" style="margin-top:18px"><div>Owner</div><div>${esc(t.owner||"—")}</div><div>Tags</div><div>${esc((t.tags||[]).join(", ")||"—")}</div><div>Takes</div><div>${t.minutes?`~${t.minutes} min`:"—"}</div></div></div>`;
 return `${crumbs(fromBuild?[["Builds","#/builds"],[fromBuild.build.id,`#/build/${enc(fromBuild.id)}`],[name]]:[["Tests","#/tests"],[name]])}
 <div class="row between"><h1 class="mono" style="font-size:24px;overflow-wrap:anywhere">${esc(name)}</h1><span class="status" style="font-size:15px"><span class="dot ${resDot(e.result)}"></span>${esc(e.result=="PASS"?"Passed":e.result=="SKIP"?"Skipped":e.result=="CRASH"?"Crashed":"Failed")}</span></div>
 <div class="row small muted" style="margin-top:8px">${typePill(t.type)}<span>build <a class="mono" href="#/build/${enc(e.run)}" style="color:var(--fg)">${esc(e.build)}</a> · ${esc(ago(e.at))}</span></div>
 <div class="card" style="margin-top:22px;padding:14px 16px"><div class="row between nowrap"><span class="hist" style="flex-wrap:wrap">${es.map(x=>`<a href="#/test/${enc(name)}?run=${enc(x.run)}" class="${resCls(x.result)} ${x===e?"sel":""}" title="${esc(x.build)} · ${esc(x.result)} · ${esc(ago(x.at))}"></a>`).join("")}</span><span class="xs faint hide-sm">last ${es.length} runs</span></div></div>
 ${failing.length?`<div class="small r" style="margin-top:14px">${failing.length} of ${e.checks.length} checks failed</div>`:""}
 <div class="subtabs">${[["checks",`Checks ${e.checks.length}`],["shots",`Screenshots ${shots.length}`],["log","Log"],["about","About"]].map(([k,x])=>`<a class="${tab==k?"on":""}" onclick="sub.test='${k}';render()">${x}</a>`).join("")}</div>${body}`}

/* ---------- machines ---------- */
function pMachines(){const ms=Object.keys(D.machines);
 return `<h1>Machines</h1><p class="muted small" style="margin:6px 0 0">Your agent adds and checks machines (<span class="mono">irisify machine add</span>). Anything it needs from you shows up in Needs you.</p>
 <div class="machines" style="margin-top:20px">${ms.map(machineCard).join("")||`<div class="card pad empty">No machines yet. Add the one that runs the game first.</div>`}</div>
 <div class="sec"><h2>Headsets</h2><div class="list">${D.profiles.map(p=>`<div class="li"><span class="dot ${p.supported?"ok":"off"}"></span><span class="grow">${esc(p.name)}</span><span class="small faint hide-sm">${p.display?.px_per_degree?`~${p.display.px_per_degree} px/°`:""}</span><span class="pill ${p.supported?"ok":""}">${p.supported?"Supported":"Bindings only"}</span></div>`).join("")}</div></div>`}
function pMachine(parts){const n=parts[1];if(!D.machines[n])return `${crumbs([["Machines","#/machines"],[n]])}<div class="empty">No such machine</div>`;
 const i=mInfo(n);const s=i.s;const tab=sub.machine||"overview";const pf=D.preflight[n]?.checks||[];
 const fixRow=(ok,what,fix,who)=>`<div class="li" style="display:block"><div class="row nowrap"><span class="dot ${ok?"ok":ok===false?"bad":"off"}"></span><span class="grow">${esc(what)}</span>${!ok&&who=="you"?`<span class="pill warn">you</span>`:""}</div>
  ${!ok&&fix?`<div class="row nowrap" style="margin:10px 0 0 23px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px"><span class="mono xs grow" style="overflow-wrap:anywhere">${esc(fix)}</span><button class="btn sm" onclick="copy(this)" data-t="${esc(fix)}">Copy</button></div>`:""}</div>`;
 const steps=(s.steps||[]).slice().sort((a,b)=>(a.done!==false)-(b.done!==false));const pfs=pf.slice().sort((a,b)=>(a.ok!==false)-(b.ok!==false));
 const body=tab=="setup"?(steps.length?`<div class="list">${steps.map(x=>fixRow(x.done,x.what,x.fix,x.who)).join("")}</div>`:`<div class="empty">Nothing to set up on this machine</div>`)
 :tab=="preflight"?(pfs.length?`<div class="list">${pfs.map(c=>fixRow(c.ok,c.what,c.fix,c.who)).join("")}</div>`:`<div class="empty">Not checked yet: irisify doctor platform --machine ${esc(n)}</div>`)
 :`<div class="card pad"><div class="kv"><div>Does</div><div>${esc(i.roles.map(r=>ROLE[r]||r).join(", "))}</div><div>Link</div><div class="mono">${esc(i.m.link)}${i.m.host?" · "+esc(i.m.host):""}</div>
  ${s.tailscale?`<div>Tailscale</div><div>${s.tailscale.peer_online?"online":"offline"}</div>`:""}${i.prof?`<div>Headset</div><div>${esc(i.prof.name)}</div>`:""}
  ${s.facts?.kernel?`<div>System</div><div>${esc(s.facts.os)} ${esc(s.facts.kernel)}</div>`:""}${!i.dev?`<div>Build</div><div class="mono">${esc(i.build||"none yet")}</div>`:""}
  ${s.facts?.lock?`<div>Lock</div><div>${esc(s.facts.lock)}</div>`:""}${s.error?`<div>Error</div><div class="err">${esc(s.error)}</div>`:""}<div>Checked</div><div>${s.at?esc(ago(s.at)):"never"}</div></div></div>`;
 const sd=(s.steps||[]).length,sdone=(s.steps||[]).filter(x=>x.done).length,pd=pf.filter(c=>c.ok).length;
 return `${crumbs([["Machines","#/machines"],[n]])}
 <div class="row between"><div class="row nowrap"><div class="mcard" style="padding:0;border:none;background:none"><div class="ico">${ICON[i.kind]}</div></div><div><h1>${esc(n)}</h1><div class="muted small">${esc(i.roles.map(r=>ROLE[r]||r).join(" · "))}</div></div></div>
 <span class="status" style="font-size:15px"><span class="dot ${i.state}"></span>${i.stateText}</span></div>
 <div class="subtabs">${[["overview","Overview"],["setup",`Setup${sd?` ${sdone}/${sd}`:""}`],["preflight",`Preflight${pf.length?` ${pd}/${pf.length}`:""}`]].map(([k,x])=>`<a class="${tab==k?"on":""}" onclick="sub.machine='${k}';render()">${x}</a>`).join("")}</div>${body}`}

/* ---------- screenshots ---------- */
function pShots(){const sh=D.shots;const types=["All",...new Set(sh.map(s=>typeOf(s.scenario)))];const t=filt.stype||"All";
 const shown=sh.filter(s=>t=="All"||typeOf(s.scenario)==t);const todo=sh.filter(s=>!s.review).length;

 <div class="chips" style="margin:20px 0">${types.map(x=>`<span class="chip ${t==x?"on":""} ${tcls(x)}" onclick="filt.stype='${esc(x)}';render()">${x!="All"?`<span class="tdot"></span>`:""}${esc(x.split(" ")[0])}</span>`).join("")}</div>
 <div class="gallery">${shown.map(s=>{const i=sh.indexOf(s);const fl=open["f"+i];return `<div class="shotcard ${tcls(typeOf(s.scenario))}">${s.present?`<img loading="lazy" src="${shotURL(s.run,s.file)}" alt="" onclick="zoom(this.src,'${esc(s.scenario)} · ${esc(s.moment)}')">`:`<div class="ph">not captured</div>`}
 <div class="body"><div class="row between nowrap"><a class="mono small ell" href="#/test/${enc(s.scenario)}?run=${enc(s.run)}"><span class="tdot" style="margin-right:6px"></span><b>${esc(s.scenario)}</b></a>${s.review?`<span class="pill ${s.review.verdict=="ok"?"ok":"bad"}">${s.review.verdict=="ok"?"ok":"flagged"}</span>`:""}</div>
 ${s.question?`<div class="small muted" style="margin-top:6px">${esc(s.question)}</div>`:""}
 ${s.review?"":fl?`<div class="row nowrap" style="margin-top:10px"><input id="ans${i}" placeholder="What's wrong?" class="grow"><button class="btn sm primary" onclick="review(${i},'flag')">Flag</button></div>`
  :`<div class="row" style="margin-top:10px"><button class="btn sm" onclick="review(${i},'ok')">Looks right</button><button class="btn sm ghost" onclick="open['f${i}']=1;render()">Flag…</button>${s.before?`<button class="btn sm ghost" onclick="zoom('${shotURL(s.before.run,s.before.file)}','before: ${esc(s.before.build)}')">Before</button>`:""}</div>`}</div></div>`}).join("")||`<div class="empty">No screenshots yet</div>`}</div>`}
async function review(i,v){const s=D.shots[i];await post("/api/review",{run:s.run,file:s.file,verdict:v,answer:$("ans"+i)?.value||"",moment:s.moment,owner:s.owner});load()}

/* ---------- issues, checklist, intake ---------- */
function pIssues(){const is=D.issues.slice().sort((a,b)=>(a.state=="closed")-(b.state=="closed"));
 return `<h1>Issues</h1><div class="row nowrap" style="margin-top:20px"><input id="iTitle" placeholder="Tell the agent something, e.g. swimming is still too slow" class="grow"><button class="btn primary" onclick="addIssue()">Add</button></div><div id="iErr" class="err"></div>
 <div class="list sec">${is.map(i=>`<div class="li"><span class="dot ${i.state=="closed"?"ok":"bad"}"></span><span class="grow">${esc(i.title)}</span><span class="pill hide-sm">${esc(i.owner||"unrouted")}</span><span class="small faint">${esc(i.state)}</span></div>`).join("")||`<div class="empty">No issues</div>`}</div>`}
async function addIssue(){const t=$("iTitle").value.trim();if(!t){$("iErr").textContent="Write what you noticed first";return}await post("/api/issue",{title:t,owner:null,source:"user"});load()}
function pChecklist(){const ready=D.workflow.phases.find(p=>p.id=="ready")||{evidence:[]};
 return `<div class="row between"><h1>Headset checklist</h1><span class="pill ${ready.ok?"ok":"warn"}">${ready.ok?"Ready":"Not yet"}</span></div>
 <p class="muted">Things the rig can't judge. Check them in the headset.</p>
 <div class="list sec">${D.checklist.map(c=>`<label class="li click"><input type="checkbox" style="height:auto"><span class="grow">${esc(c.item)}</span><span class="xs faint hide-sm">${c.from.length} test${c.from.length>1?"s":""}</span></label>`).join("")||`<div class="empty">Nothing yet</div>`}</div>
 <details class="sec"><summary class="small muted">Before you put it on ›</summary><div class="card pad" style="margin-top:10px">${ready.evidence.map(e=>`<div class="small">${esc(e)}</div>`).join("")}</div></details>`}
function pIntake(){const I=D.intake;const left=I.questions.filter(q=>!I.answers[q.id]).length;
 return `<div class="row between"><h1>Intake</h1><span class="pill ${left?"warn":"ok"}">${left?`${left} to answer`:"All answered"}</span></div><p class="muted">Questions only you can answer. “You decide” takes the recommendation.</p>
 <div class="list sec">${I.questions.map(q=>{const a=I.answers[q.id];
 return `<div class="li" style="display:block"><div class="row between nowrap"><b>${esc(q.q)}</b>${q.rank=="blocking"&&!a?`<span class="pill bad">blocking</span>`:""}</div><div class="small muted" style="margin:4px 0 10px">${esc(q.why)}</div>
 ${a?`<span class="pill ok">${esc(a.value)}</span>`:`<div class="row">${q.free_text?`<input id="ft_${q.id}" placeholder="${esc(q.recommend)}" class="grow"><button class="btn sm" onclick="ans('${q.id}',$('ft_${q.id}').value||'${esc(q.recommend)}')">Save</button>`:(q.options||[]).map(o=>`<button class="btn sm ${o==q.recommend?"primary":""}" onclick="ans('${q.id}','${esc(o)}')">${esc(o)}</button>`).join("")}<button class="btn sm ghost" onclick="ans('${q.id}','${esc(q.recommend)}','agent')">You decide</button></div>`}</div>`}).join("")}</div>`}
async function ans(id,v,src){await post("/api/intake",{id,value:v,source:src||"user",why:src=="agent"?"you decide: recommendation":null});load()}
load();setInterval(()=>{if(!document.hidden&&!document.activeElement?.matches("input,select"))load()},30000);
